<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - DirectionalMarker</title>

  <link rel="stylesheet" href="register.css">
  <link rel="icon" href="logo.jpg" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
</head>

<body>

  <header>


<img src="logo.jpg" height="75px" width="75px">

<h1>Register</h1>

<nav>
  <ul>

    <li>
      <a href="index.html">Home</a>
    </li>

    <li class="dropdown">
      <a href="javascript:void(0)" class="dropbtn">
        Class Information
      </a>

      <div class="dropdown-content">
        <a href="timetable.html">Class Schedule</a>
        <a href="register-class.html">Register Timetable</a>
      </div>
    </li>
    <li class="dropdown">
      <a href="javascript:void(0)" class="dropbtn">
        Account
      </a>

      <div class="dropdown-content">
        <a href="login.html">Log In</a>
        <a href="register.html">Register</a>
      </div>
    </li>

  </ul>
</nav>


  </header>

  <div class="register-container">


<h2>Register</h2>

<form id="registerForm">

  <input
    type="text"
    id="name"
    placeholder="Name"
    required
  >

  <input
    type="email"
    id="email"
    placeholder="Email"
    required
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    required
  >

    <span>
    <input
      type="checkbox"
      id="termsCheckbox"
      required
    >

    <label for="termsCheckbox">
      I accept the
      <a href="terms.html" target="_blank">T&Cs</a>
      and
      <a href="privacy-policy.html" target="_blank">
        Privacy Policy
      </a>
    </label>
    </span>

  <button
    type="submit"
    id="registerButton"
  >
    Register
  </button>

</form>

<p id="registerStatus" class="status-message"></p>


  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    }
      from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";


    // Firebase configuration

    const firebaseConfig = {

      apiKey: "AIzaSyAMQ6qkuWzTOZKJnoal01MrqVaAy32aXlc",

      authDomain: "directionalmarker.firebaseapp.com",

      projectId: "directionalmarker",

      storageBucket: "directionalmarker.appspot.com",

      messagingSenderId: "124118111336",

      appId: "1:124118111336:web:c7ebea9a5869c263c157dd"

    };


    // Initialize Firebase

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    // Registration form

    const registerForm = document.getElementById("registerForm");

    const registerStatus =
      document.getElementById("registerStatus");


    registerForm.addEventListener("submit", async function (event) {

      event.preventDefault();


      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      // Make sure the name isn't empty

      if (name === "") {

        registerStatus.textContent =
          "Please enter your name.";

        registerStatus.style.color = "red";

        return;

      }


      try {

        // Create the Firebase Authentication account

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        // Get the newly created user

        const user = userCredential.user;


        // Save the name to the Firebase user profile

        await updateProfile(user, {

          displayName: name

        });


        // Registration successful

        registerStatus.textContent =
          "Registration successful!";

        registerStatus.style.color = "green";


        console.log("User registered:", user);


        // Redirect after registration

        setTimeout(() => {

          window.location.href = "index.html";

        }, 1000);


      } catch (error) {

        console.error("Registration error:", error);


        switch (error.code) {

          case "auth/email-already-in-use":

            registerStatus.textContent =
              "An account with this email already exists.";

            break;


          case "auth/invalid-email":

            registerStatus.textContent =
              "Please enter a valid email address.";

            break;


          case "auth/weak-password":

            registerStatus.textContent =
              "Your password is too weak. Please use a stronger password.";

            break;


          case "auth/operation-not-allowed":

            registerStatus.textContent =
              "Email/password registration is not enabled.";

            break;


          default:

            registerStatus.textContent =
              "Registration failed. Please try again.";

            console.error(error);

        }


        registerStatus.style.color = "red";

      }

    });

  </script>

</body>

</html>
